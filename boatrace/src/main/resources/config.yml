# BoatRace - settings (arena definitions live in arenas.yml, times in the shared MariaDB database)

Server:
  Name: hub

  # Optional group this server belongs to (must match server-groups in the proxy's config.yml).
  # Group bans on this group also apply here. Leave empty for none.
  Group: ''

# -------------------------------------------------------------------------------------------------
# The shared MariaDB database (the same one the proxy uses).
# -------------------------------------------------------------------------------------------------
Database:
  Host: 10.40.0.10
  Port: 3306
  Name: name
  User: user
  Password: pass
  Pool_Size: 6
  Connection_Timeout_Millis: 10000

  # A pooled connection is replaced after Max_Lifetime_Millis, and idle ones are pinged every Keepalive_Millis. Both keep a database
  # server or firewall that closes quiet connections (MariaDB wait_timeout, idle limits) from leaving dead ones in the pool, which
  # shows up as "Failed to validate connection ... closed connection" warnings. Keep Max_Lifetime_Millis below the shortest such limit.
  # Keepalive_Millis: 0 turns the ping off, otherwise it must be 30000 or more and below Max_Lifetime_Millis.
  Max_Lifetime_Millis: 600000
  Keepalive_Millis: 60000

# Tables: boatrace_records (best times, column server_name = Server.Name of the server the time was driven on),
# boatrace_runs (every finished race with server_name / server_group - for a web panel), boatrace_blacklist,
# boatrace_rewards. Server and Database changes need a server restart (not /bre reload).
records:
  # how often (seconds) the leaderboard cache is reloaded from the database, so times from other servers show up
  refresh-seconds: 30

# -------------------------------------------------------------------------------------------------
# Sounds: "sound" is a Bukkit Sound name (ENTITY_PLAYER_LEVELUP) or a sound key
# (minecraft:entity.player.levelup, resource pack sounds work too). NONE = silent. Volume 0.0+, pitch 0.5 - 2.0.
# -------------------------------------------------------------------------------------------------
Sounds:
  # every F1 lamp that lights up; the pitch rises by pitch-step per lamp (0 = constant)
  start-countdown:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 0.6
    pitch-step: 0.16
  # lights out / green light
  start-go:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.5
  checkpoint:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.8
    pitch: 1.4
  finish:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
  off-track:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.6
  jumpstart-penalty:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  # a lap is completed in a multi-lap race (start/finish line crossed with all checkpoints)
  lap:
    sound: BLOCK_NOTE_BLOCK_CHIME
    volume: 1.0
    pitch: 1.2
  # the racer touched a reset zone (/bre addresetzone)
  reset-zone:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
  # finish line crossed with a skipped checkpoint
  missed-checkpoint:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 0.8

# Command executed (as the player) when they press [HUB] or use /bre leave.
# If it does not exist the player is teleported back to where they joined from.
hub-command: "spawn"

# Boat entity type. Any *_BOAT entity type works (OAK_BOAT, BIRCH_BOAT, ...).
boat-type: OAK_BOAT

# Delay (ticks, 20 = 1 second) between crossing the finish line and being sent to the hub (hub-command).
# During this pause the final time is shown on the action bar / title. RESET still works meanwhile.
finish-teleport-delay-ticks: 60

# Dynamic jumpstart penalty (moving / crossing the start line before lights out).
# The earlier the jumpstart, the higher the penalty: moving before the first lamp lights up gives max-seconds,
# moving after all lamps are lit gives min-seconds, linear in between (e.g. 5 lamps: 12.5, 10.9, 9.3, 7.7, 6.1, 4.5).
jumpstart-penalty:
  min-seconds: 4.5
  max-seconds: 12.5

start-lights:
  lamps: 5                  # how many lamps "/bre lights <arena> set" splits the wand selection into
  first-delay-ticks: 20     # delay before the first lamp lights up
  interval-ticks: 20        # delay between lamps
  hold-min-ticks: 10        # random pause between last lamp and lights out (min)
  hold-max-ticks: 50        # ... (max)
  lamp-on-block: RED_CONCRETE
  lamp-off-block: BLACK_CONCRETE   # unlit lamps (and all lamps after lights out when start-signal is disabled)

# Start signal = the F1 lamps themselves (/bre lights): the same blocks light up red during the countdown, turn into
# "go-block" at lights out and, after duration-seconds, into "off-block" - this frees / resets the start line.
# enabled: false = the lamps simply go dark at lights out.
start-signal:
  enabled: true
  # CLIENT = only the racers see the change (world untouched); WORLD = the real blocks change (e.g. a BARRIER gate)
  mode: CLIENT
  go-block: LIME_CONCRETE
  # "" = the real block of the world (e.g. build the lamps from black concrete), or any block such as AIR / BLACK_CONCRETE.
  off-block: ""
  duration-seconds: 5.0

# Off-track detection: while racing (after the start line), the block under the boat must be a track block.
# Track blocks are set per arena (/bre trackblocks <arena> ...); arenas without own blocks use default-track-blocks.
# An empty list on both = detection disabled for that arena.
off-track:
  enabled: true
  check-interval-ticks: 2   # how often the block under the boat is checked
  grace-ticks: 10           # how long the boat may be off track before the action is applied
  # PENALTY       = add penalty-seconds to the time
  # TELEPORT_BACK = put the boat back on the last on-track position + penalty-seconds
  # RESET         = restart the run (in events: same as TELEPORT_BACK, an event cannot be restarted)
  action: PENALTY
  penalty-seconds: 3.0
  # Flying and falling is NEVER punished: no penalty, no warning, and the grace time starts anew after landing.
  # A boat counts as flying / falling when the game says so (boat status IN_AIR) or when there is nothing to drive on
  # under it: no solid block, water or lava (non-solid decoration like grass does not count) within scan-depth blocks.
  scan-depth: 3             # how deep under the boat (blocks) a surface is looked for
  # The boat is on the track as soon as ANY block under this radius (blocks) around its centre is a track block, so a
  # boat half over the edge is not punished. 0 = only the block under the centre.
  footprint-radius: 0.5
  # Used by arenas that have no own track blocks. Empty by default so existing tracks are not penalized
  # until you configure them. Example: [ICE, PACKED_ICE, BLUE_ICE]
  default-track-blocks: []

# Grid positions per arena: /bre setspawn <arena> <1, 2, 3 ...> - unlimited. Solo races always start on position #1,
# event racers get the next free position. Laps per arena: /bre laps <arena> <count> (events: /bre start <arena> <laps>).

# Event mode: /bre event <arena> open -> joining players get grid positions 1, 2, 3 ...
# The lights start with /bre start <arena>, or automatically once every position is taken.
event:
  auto-start-when-full: true
  start-delay-ticks: 60     # pause before the lights when the lobby filled up / /bre start was used

# Party (/party, in memory): default and maximum number of players per party, how long an invitation is valid.
party:
  default-limit: 4
  max-limit: 10
  invite-timeout-seconds: 60

# Queue: joining a busy map (no free instance, no fallback copy / free arena) puts the player - or the whole party
# when its leader joins - in the queue of that map. The first in line starts as soon as the race on it is over.
# false = a busy map is simply refused.
queue:
  enabled: true

# Map permissions boatrace.map.<arena name in lower case> (boatrace.map.* = all maps) are always checked by the map menu
# (/bre gui). true = /bre join <arena> requires them for joining yourself too (default false: NPCs, signs and old
# habits keep working). Sending other players (/bre join <arena> <player>) never needs them.
map-permissions:
  enforce-on-join-command: false

# Fallback maps: an arena is used by one solo racer (or one event) at a time. When it is busy, the player is
# sent to an identical copy of the track in another world (same coordinates).
fallback:
  enabled: true
  # when the arena and all its copies are busy: send the player to another random free arena
  random-free-arena: true
  maps:
    # arena name: [worlds that contain a copy of it]
    example_arena:
      - example_arena_copy_1
      - example_arena_copy_2

# Tab list (player list) for a server that only runs BoatRace: true = players in the lobby only see the lobby, racers
# only see the players of their own race (solo, event, party or competitive match - also on the grid and after the
# finish); a spectator (/bre spectate) sees the session they watch. Players stay visible in the world, only the tab
# list is filtered (works with the TAB plugin as long as its "layout" feature is off). boatrace.tablist.bypass = see all.
tablist:
  session-only: false

# Hotbar buttons given to racers (the player's real inventory is saved and restored).
hotbar:
  enabled: true
  reset-slot: 7             # 0-8
  hub-slot: 8               # 0-8

placeholders:
  empty: "-"                # returned when there is no time / no player on the position

# Ranking: ONE rating per player, ELO-like points (as in chess). Casual ranked races = event and party races with at least
# min-racers racers at lights out. The finishing order counts as duels - everybody beat everybody behind them, players
# who left the race are behind all finishers (who left first is last). Losing costs points, so arranged results
# between friends do not pay off: they just pass the same points back and forth. Solo runs are never ranked.
# Points are settled once nobody is racing any more. /bre reload and server stops never cost anybody points.
# Competitive matches move the SAME rating, harder (competitive.k-factor) - see "competitive" below.
# Placeholders for holograms / scoreboards: see the README (%boatrace_rating%, %boatrace_rating_top_player_1% ...).
ranking:
  enabled: true
  start-rating: 1000
  min-rating: 100           # nobody falls below this
  k-factor: 16              # points at stake per CASUAL race (competitive: competitive.k-factor)
  min-racers: 2             # also needed for wins and podiums
  party-races: true         # false = races of a /party do not count (friends only racing each other)
  leaderboard-min-games: 5  # ranked races needed to appear on the leaderboard
  # season pass XP of a race (CaptainHook) is multiplied by the tier of the player's rating:
  # the highest rating below that is at most the player's rating wins
  xp-multipliers:
    0: 0.5
    900: 1.0
    1100: 1.25
    1300: 1.5
    1500: 2.0

# CaptainHook (the network's core plugin, optional): stats of FINISHED races for the website leaderboards,
# achievements and season pass missions, plus season pass XP. Without CaptainHook (or with enabled: false) nothing
# is reported. A race that is not finished (left, /bre reload, restart) reports nothing.
#
# Stats of the game below (one message per finished race; the keys and units are a contract with the website,
# never change their meaning):
#   races                 add  finished races              wins / podiums   add  1st / top 3 of a ranked race
#   laps                  add  finished laps               distance         add  blocks sailed
#   race_time_ms          add  time in races (ms, without penalties) - with distance: the overall average speed
#   fastest_lap           min  best lap (ms)               fastest_<track>  min  best lap on the track (ms)
#   fastest_race_<track>  min  best time of the whole race on the track (ms), races with the arena's own lap count
#   top_avg_speed         max  best average speed of one race, blocks/s x 100 (12.34 b/s = 1234)
#   best_streak           max  ranked races in a row finished without being last (the CURRENT run is reported)
#   rating                set  ranking points (sent when a ranked race is settled)
# <track> = arena name in lower case, characters other than a-z, 0-9 and _ become _, at most 19 characters
# (/bre tracks lists them). Players on the blacklist (/bre admin) report nothing and get no XP.
captainhook:
  enabled: true
  game: "formula-boat-racing"
  # implausible results are not reported at all - a min / max stays in the database forever
  min-lap-seconds: 5        # a lap faster than this
  max-avg-speed: 75         # blocks/s (a boat on blue ice does about 72)
  # season pass XP (0 = none), multiplied by ranking.xp-multipliers. Podium XP is for 2nd and 3rd place.
  pass-xp:
    finish: 5
    win: 20
    podium: 10
    personal-best: 10       # a new personal best time (single-lap races)
    blocks-per-xp: 250      # 1 XP per this many blocks sailed in a finished race (0 = none)
    daily-limit: 300        # most XP per player and day from BoatRace (0 = no limit; resets at midnight / restart)

# Competitive: team against team, from a lobby. A party = one team (up to max-team-size), a solo player = a team of 1.
# Join: /bre ranked <arena|random>, the GUI (gui.yml "competitive-buttons"). Per arena (/bre compset or arenas.yml
# "competitive: { enabled, min-players, max-players }"): min-players starts the countdown, max-players (never more than
# the grid positions) starts at once. Teams that do not fit any more wait for the next match.
# Grid: the first racer of every team, then the second ones ... Every racer wears the team color.
# Result: every racer scores the points of their place (DNF = 0), a team scores the AVERAGE of its members (teams of
# different sizes are comparable, the weakest member counts too). Tie: the team with the best single place.
# Rating: the teams in standing order are one ELO race (a team = the average rating of its members), every member gets
# the change of their team - into their own (shared) rating. Leaving a running match: DNF + leaver penalty + cooldown
# (not for boatrace.competitive.bypass = ops, for testing). Races of the "not last" streak count by the racer's own place.
competitive:
  enabled: false
  min-players: 4            # default for arenas without their own min-players
  max-team-size: 4
  countdown-seconds: 30     # once min-players is reached; a full lobby starts at once
  k-factor: 48              # rating points at stake (casual: ranking.k-factor)
  points: [10, 8, 6, 5, 4, 3, 2, 1]   # 1st, 2nd, 3rd ... place; places beyond the list score 0
  leaver:
    rating-penalty: 15      # on top of the DNF
    cooldown-minutes: 5     # no competitive lobby for this long
  # season pass XP (CaptainHook): the race XP (captainhook.pass-xp) x xp-multiplier, plus:
  xp-multiplier: 2.0
  pass-xp:
    win: 30                 # every member of the winning team who finished
    full-team: 10           # every member of a team whose members ALL finished
  # The same lineup coming back: + per-match XP for every match in a row with exactly the same teammates (up to max).
  # In memory only, one tiny entry per player; forgotten after expire-minutes without a match or a restart.
  lineup-bonus:
    per-match: 0.10
    max: 0.30
    expire-minutes: 30
  # Team colors in assignment order (team 1 = first). Also the most teams of one match.
  # armor: a Bukkit color name (RED, BLUE, LIME, AQUA, ORANGE, PURPLE ...) or "#RRGGBB".
  colors:
    RED:    { name: "Red",    armor: RED,    chat: "&c" }
    BLUE:   { name: "Blue",   armor: BLUE,   chat: "&9" }
    GREEN:  { name: "Green",  armor: GREEN,  chat: "&a" }
    YELLOW: { name: "Yellow", armor: YELLOW, chat: "&e" }
    ORANGE: { name: "Orange", armor: ORANGE, chat: "&6" }
    PURPLE: { name: "Purple", armor: PURPLE, chat: "&5" }
    AQUA:   { name: "Aqua",   armor: AQUA,   chat: "&b" }
    WHITE:  { name: "White",  armor: WHITE,  chat: "&f" }
  # The team tag as a TRANSIENT LuckPerms meta (never saved, gone on logout) while the player races a match.
  # Show it between the rank prefix and the name in your chat / TAB format, e.g.
  #   "%luckperms_prefix%%luckperms_meta_boatrace_team%%player_name%"
  # Without LuckPerms use %boatrace_team_tag% (same text).
  luckperms:
    enabled: true
    meta-key: "boatrace_team"
    format: "{chat}[{name}] "   # {chat} {name} {id}
