# BoatRace - settings (arena definitions live in arenas.yml, times in the shared MariaDB database)

Server:
  Name: hub

  # Optional group this server belongs to (must match server-groups in the proxy's config.yml).
  # Group bans on this group also apply here. Leave empty for none.
  Group: ''

# -------------------------------------------------------------------------------------------------
# The shared MariaDB database (the same one the proxy uses).
# -------------------------------------------------------------------------------------------------
Database:
  Host: 10.40.0.10
  Port: 3306
  Name: name
  User: user
  Password: pass
  Pool_Size: 6
  Connection_Timeout_Millis: 10000

  # A pooled connection is replaced after Max_Lifetime_Millis, and idle ones are pinged every Keepalive_Millis. Both keep a database
  # server or firewall that closes quiet connections (MariaDB wait_timeout, idle limits) from leaving dead ones in the pool, which
  # shows up as "Failed to validate connection ... closed connection" warnings. Keep Max_Lifetime_Millis below the shortest such limit.
  # Keepalive_Millis: 0 turns the ping off, otherwise it must be 30000 or more and below Max_Lifetime_Millis.
  Max_Lifetime_Millis: 600000
  Keepalive_Millis: 60000

# Tables: boatrace_records (best times, column server_name = Server.Name of the server the time was driven on),
# boatrace_runs (every finished race with server_name / server_group - for a web panel), boatrace_blacklist,
# boatrace_rewards. Server and Database changes need a server restart (not /bre reload).
records:
  # how often (seconds) the leaderboard cache is reloaded from the database, so times from other servers show up
  refresh-seconds: 30

# -------------------------------------------------------------------------------------------------
# Sounds: "sound" is a Bukkit Sound name (ENTITY_PLAYER_LEVELUP) or a sound key
# (minecraft:entity.player.levelup, resource pack sounds work too). NONE = silent. Volume 0.0+, pitch 0.5 - 2.0.
# -------------------------------------------------------------------------------------------------
Sounds:
  # every F1 lamp that lights up; the pitch rises by pitch-step per lamp (0 = constant)
  start-countdown:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 0.6
    pitch-step: 0.16
  # lights out / green light
  start-go:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.5
  checkpoint:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.8
    pitch: 1.4
  finish:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
  off-track:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.6
  jumpstart-penalty:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  # a lap is completed in a multi-lap race (start/finish line crossed with all checkpoints)
  lap:
    sound: BLOCK_NOTE_BLOCK_CHIME
    volume: 1.0
    pitch: 1.2
  # finish line crossed with a skipped checkpoint
  missed-checkpoint:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 0.8

# Command executed (as the player) when they press [HUB] or use /bre leave.
# If it does not exist the player is teleported back to where they joined from.
hub-command: "spawn"

# Boat entity type. Any *_BOAT entity type works (OAK_BOAT, BIRCH_BOAT, ...).
boat-type: OAK_BOAT

# Delay (ticks, 20 = 1 second) between crossing the finish line and being sent to the hub (hub-command).
# During this pause the final time is shown on the action bar / title. RESET still works meanwhile.
finish-teleport-delay-ticks: 60

# Dynamic jumpstart penalty (moving / crossing the start line before lights out).
# The earlier the jumpstart, the higher the penalty: moving before the first lamp lights up gives max-seconds,
# moving after all lamps are lit gives min-seconds, linear in between (e.g. 5 lamps: 12.5, 10.9, 9.3, 7.7, 6.1, 4.5).
jumpstart-penalty:
  min-seconds: 4.5
  max-seconds: 12.5

start-lights:
  lamps: 5                  # how many lamps "/bre lights <arena> set" splits the wand selection into
  first-delay-ticks: 20     # delay before the first lamp lights up
  interval-ticks: 20        # delay between lamps
  hold-min-ticks: 10        # random pause between last lamp and lights out (min)
  hold-max-ticks: 50        # ... (max)
  lamp-on-block: RED_CONCRETE
  lamp-off-block: BLACK_CONCRETE   # unlit lamps (and all lamps after lights out when start-signal is disabled)

# Start signal = the F1 lamps themselves (/bre lights): the same blocks light up red during the countdown, turn into
# "go-block" at lights out and, after duration-seconds, into "off-block" - this frees / resets the start line.
# enabled: false = the lamps simply go dark at lights out.
start-signal:
  enabled: true
  # CLIENT = only the racers see the change (world untouched); WORLD = the real blocks change (e.g. a BARRIER gate)
  mode: CLIENT
  go-block: LIME_CONCRETE
  # "" = the real block of the world (e.g. build the lamps from black concrete), or any block such as AIR / BLACK_CONCRETE.
  off-block: ""
  duration-seconds: 5.0

# Off-track detection: while racing (after the start line), the block under the boat must be a track block.
# Track blocks are set per arena (/bre trackblocks <arena> ...); arenas without own blocks use default-track-blocks.
# An empty list on both = detection disabled for that arena.
off-track:
  enabled: true
  check-interval-ticks: 2   # how often the block under the boat is checked
  grace-ticks: 10           # how long the boat may be off track before the action is applied
  # PENALTY       = add penalty-seconds to the time
  # TELEPORT_BACK = put the boat back on the last on-track position + penalty-seconds
  # RESET         = restart the run (in events: same as TELEPORT_BACK, an event cannot be restarted)
  action: PENALTY
  penalty-seconds: 3.0
  scan-depth: 3             # blocks scanned downwards for the first solid block (air = airborne, ignored)
  # Used by arenas that have no own track blocks. Empty by default so existing tracks are not penalized
  # until you configure them. Example: [ICE, PACKED_ICE, BLUE_ICE]
  default-track-blocks: []

# Grid positions per arena: /bre setspawn <arena> <1, 2, 3 ...> - unlimited. Solo races always start on position #1,
# event racers get the next free position. Laps per arena: /bre laps <arena> <count> (events: /bre start <arena> <laps>).

# Event mode: /bre event <arena> open -> joining players get grid positions 1, 2, 3 ...
# The lights start with /bre start <arena>, or automatically once every position is taken.
event:
  auto-start-when-full: true
  start-delay-ticks: 60     # pause before the lights when the lobby filled up / /bre start was used

# Fallback maps: an arena is used by one solo racer (or one event) at a time. When it is busy, the player is
# sent to an identical copy of the track in another world (same coordinates).
fallback:
  enabled: true
  # when the arena and all its copies are busy: send the player to another random free arena
  random-free-arena: true
  maps:
    # arena name: [worlds that contain a copy of it]
    example_arena:
      - example_arena_copy_1
      - example_arena_copy_2

# Hotbar buttons given to racers (the player's real inventory is saved and restored).
hotbar:
  enabled: true
  reset-slot: 7             # 0-8
  hub-slot: 8               # 0-8

placeholders:
  empty: "-"                # returned when there is no time / no player on the position
