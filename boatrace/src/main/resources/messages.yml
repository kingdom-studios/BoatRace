# BoatRace - every text shown by the plugin (chat, action bar, titles, item names).
#
# Color codes: & (e.g. &a, &l). Placeholders are written as {name} - each message lists the ones it supports.
# {prefix} is inserted automatically in front of every CHAT message (except the finish summary, where you
# can place it yourself). Set any message to "" (or an empty list) to disable it.
# Values may be a single line or a list of lines. Reload with /bre reload.

prefix: "&8[&bBoatRace&8] &7"

# ------------------------------------------------------------------------------------------------
# Action bar (refreshed every server tick)
# ------------------------------------------------------------------------------------------------
actionbar:
  # {lap_text} in the lines below: shown only in multi-lap races, empty otherwise. {lap} {laps}
  lap: "&7Lap &f{lap}&7/&f{laps} &8| "
  # Event lobby, waiting for /bre start. {time} {players} {slots} {position} {laps} {lap_text}
  lobby: "{lap_text}&eTime: &f{time} &8| &7Grid position &f#{position} &8| &7Waiting for the start &f({players}/{slots})"
  # Before lights out. {time}
  countdown: "{lap_text}&eTime: &f{time}"
  # Before lights out after a jump start. {time} {penalty}
  countdown-penalty: "{lap_text}&eTime: &f{time} &c(+{penalty}s penalty)"
  # While racing, before the first checkpoint (or when there is no personal best). {time}
  running: "{lap_text}&eTime: &f{time}"
  # While racing, after a checkpoint of the FIRST lap - the delta (to the single-lap personal best) stays until the next checkpoint.
  # From the second lap on there is no delta, the plain "running" line is used. {time} {delta_text} {lap} {laps} {lap_text}
  running-delta: "{lap_text}&eTime: &f{time} {delta_text}"
  # A party member who finished, waiting for the rest of the party. {time} {delta_text} {done} {total}
  finished-party: "{lap_text}&a&lFINISH &8| &eTime: &f{time} {delta_text} &8| &7Waiting for the party &f({done}/{total})"
  # During the short pause after the finish. {time} {delta_text} (delta_text is empty without a previous best)
  finished: "{lap_text}&a&lFINISH &8| &eTime: &f{time} {delta_text}"

# How {delta_text} is built. {delta} = 1.23, {delta_padded} = 01.23
delta:
  faster: "&a(-{delta}s)"
  slower: "&c(+{delta}s)"

# ------------------------------------------------------------------------------------------------
# Titles (title + subtitle, times in ticks)
# ------------------------------------------------------------------------------------------------
title:
  go:
    title: "&a&lGO!"
    subtitle: ""
    fade-in: 0
    stay: 14
    fade-out: 5
  # {penalty}
  jumpstart:
    title: "&c&lJUMP START!"
    subtitle: "&f+{penalty}s &cpenalty"
    fade-in: 0
    stay: 30
    fade-out: 8
  # {checkpoint} {total}
  missed-checkpoint:
    title: "&c&lMISSED CHECKPOINT"
    subtitle: "&7Checkpoint &f{checkpoint}&7/&f{total} &7was skipped - lap not counted"
    fade-in: 0
    stay: 40
    fade-out: 8
  # event: shown to every racer when the lights sequence is about to begin
  event-start:
    title: "&e&lGET READY"
    subtitle: "&7The start lights are about to begin"
    fade-in: 5
    stay: 40
    fade-out: 10
  # off track, action PENALTY. {penalty}
  off-track:
    title: ""
    subtitle: "&c&lOFF TRACK! &f+{penalty}s &cpenalty"
    fade-in: 0
    stay: 30
    fade-out: 8
  # off track, action TELEPORT_BACK. {penalty}
  off-track-back:
    title: ""
    subtitle: "&c&lOFF TRACK! &7Back on the track &f+{penalty}s"
    fade-in: 0
    stay: 30
    fade-out: 8
  # off track, action RESET
  off-track-reset:
    title: "&c&lOFF TRACK!"
    subtitle: "&7Run restarted"
    fade-in: 0
    stay: 30
    fade-out: 8
  # a new lap begins (not the last one). {lap} {laps}
  new-lap:
    title: ""
    subtitle: "&e&lLAP {lap}&7/&f{laps}"
    fade-in: 0
    stay: 25
    fade-out: 8
  # the last lap begins. {lap} {laps}
  final-lap:
    title: ""
    subtitle: "&6&lFINAL LAP &7({lap}/{laps})"
    fade-in: 0
    stay: 30
    fade-out: 8
  # {time} {arena} {laps}
  finish:
    title: "&a&lFINISH"
    subtitle: "&f{time}"
    fade-in: 2
    stay: 50
    fade-out: 10

# ------------------------------------------------------------------------------------------------
# Finish summary - the ONLY chat message a racer receives.
# {player} {arena} {time} {laps} {laps_note} {penalty_note} {best} {delta} {rank} {reward_note} {event_note}
# ------------------------------------------------------------------------------------------------
finish:
  # first finished race on this arena
  first:
    - "&8&m                                                  "
    - "  &a&lFINISH! &7Arena &f{arena}"
    - "  &7Time: &f&l{time}{laps_note}{penalty_note}"
    - "  &6&lFIRST PERSONAL BEST! &7Leaderboard: &e#{rank}"
    - "{reward_note}"
    - "{event_note}"
    - "&8&m                                                  "
  # a multi-lap race (laps > 1): only the total time - no personal best, no ranking
  multi-lap:
    - "&8&m                                                  "
    - "  &a&lFINISH! &7Arena &f{arena}"
    - "  &7Total time: &f&l{time}{laps_note}{penalty_note}"
    - "{reward_note}"
    - "{event_note}"
    - "&8&m                                                  "
  # beat the previous personal best
  new-best:
    - "&8&m                                                  "
    - "  &a&lFINISH! &7Arena &f{arena}"
    - "  &7Time: &f&l{time}{laps_note}{penalty_note}"
    - "  &6&lNEW PERSONAL BEST! &a-{delta}s &7Leaderboard: &e#{rank}"
    - "{reward_note}"
    - "{event_note}"
    - "&8&m                                                  "
  # slower than the personal best
  normal:
    - "&8&m                                                  "
    - "  &a&lFINISH! &7Arena &f{arena}"
    - "  &7Time: &f&l{time}{laps_note}{penalty_note}"
    - "  &7Personal best: &f{best} &c(+{delta}s)"
    - "{reward_note}"
    - "{event_note}"
    - "&8&m                                                  "
  # banned players (time not saved)
  banned:
    - "&8&m                                                  "
    - "  &a&lFINISH! &7Time: &f&l{time}{laps_note}{penalty_note}"
    - "  &cYou are banned - your time was not saved."
    - "&8&m                                                  "
  # Party leaderboard - sent to every party member when the LAST member has finished (fastest first, penalties included)
  # header: {arena} {laps} {laps_note} {players}
  party-header: "&8&m                                                  "
  # line: {position} {player} {time} {penalty_note} {you}
  party-line: "  &e&l#{position} &f{player} &8- &f{time}{penalty_note}{you}"
  # footer: {arena} {laps} {players}
  party-footer: "&8&m                                                  "
  party-you: " &a(you)"
  # {laps} - inserted as {laps_note} in multi-lap races
  laps-note: " &7({laps} laps)"
  # {penalty} - inserted as {penalty_note} when the run had a jump start penalty
  penalty-note: " &c(incl. +{penalty}s penalty)"
  # {arena} - inserted as {reward_note} when a reward was given (lines that end up empty are skipped)
  reward-note: "  &6&lREWARD! &7You received the reward for finishing &f{arena}&7."
  # {position} {racers} - inserted as {event_note} in events
  event-note: "  &b&lEVENT &7Finishing position: &e#{position} &7of &f{racers}"

# ------------------------------------------------------------------------------------------------
# Hotbar items / wand
# ------------------------------------------------------------------------------------------------
items:
  reset: "&e&lRESET &7(restart the run)"
  hub: "&c&lHUB &7(back to spawn)"
  wand-name: "&6&lBoatRace Wand"
  wand-lore:
    - "&eLeft click &7a block: set &fpos1"
    - "&eRight click &7a block: set &fpos2"
    - "&7Then: &f/bre setstart|setfinish|addcheckpoint|lights"

