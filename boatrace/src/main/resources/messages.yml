  not-enough-slots: "&cArena &f{arena} &conly has {slots} grid position(s), but your party has {size} players."
  only-leader-join: "&cOnly the party leader can pick a map. Leave the party with &f/party leave &cto race alone."

# ------------------------------------------------------------------------------------------------
# Queue for busy maps
# ------------------------------------------------------------------------------------------------
queue:
  # {arena} {position}
  joined: "&eThe arena &f{arena} &eis busy - you are in the queue &7(position &f#{position}&7). Leave it with &f/bre leave&7."
  already: "&eYou are already waiting for &f{arena} &7(position &f#{position}&7)."
  left: "&aYou left the queue."
  # {arena}
  cancelled: "&cThe queue for &f{arena} &cwas cancelled - the arena is no longer available."

# ------------------------------------------------------------------------------------------------
# Map menu (/bre gui) - the items themselves are configured in gui.yml
# ------------------------------------------------------------------------------------------------
gui:
  # {arena} {permission}
  no-permission: "&cYou do not have permission to play &f{arena}&c. &7({permission})"
  no-random: "&cThere is no map you can play right now."
  # {player}
  opened-other: "&aOpened the map menu for &f{player}&a."

# ------------------------------------------------------------------------------------------------
# /bre spectate
# ------------------------------------------------------------------------------------------------
spectate:
  # {player}
  started: "&aYou are now spectating &f{player}&a. Sneak to fly freely, &f/bre spectate off &ato return."
  # {player} {arena}
  started-arena: "&aSpectating &f{player} &7on &f{arena}&a. Sneak to fly freely, &f/bre spectate off &ato return."
  stopped: "&aYou stopped spectating."
  not-spectating: "&cYou are not spectating anybody."
  # {arena}
  nobody: "&cNobody is racing on &f{arena} &cright now."
  # {player}
  not-racing: "&c{player} is not racing."
  you-racing: "&cYou cannot spectate while you are racing."
  # {value}
  unknown: "&cNo racing player or arena named &f{value}&c."
