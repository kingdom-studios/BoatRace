name: BoatRace
version: '${project.version}'
main: pl.kingdomcraft.boatrace.BoatRacePlugin
api-version: '26.2'
author: Alek_Sialek
description: F1-style boat racing minigame (start lights, checkpoints, rankings, rewards).
softdepend: [PlaceholderAPI, CaptainHook, LuckPerms]

# Commands are registered dynamically by Foundation (SimpleCommandGroup "boatrace|bre"), no "commands:" block needed.
permissions:
  boatrace.admin:
    description: Arena setup (wand, zones, lights, rewards) and /bre admin commands
    default: op
  boatrace.join.others:
    description: /bre join <random|arena> <player> - send another player to a race
    default: op
  boatrace.tablist.bypass:
    description: Always see every player in the tab list (tablist.session-only)
    default: false
  boatrace.competitive.bypass:
    description: No leaver penalty / cooldown in competitive matches (testing)
    default: op
  boatrace.map.*:
    description: Play every map (boatrace.map.<arena name in lower case> = a single map). Used by the map menu.
    default: op
