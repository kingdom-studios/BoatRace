# !-----------------------------------------------------------------------------------------------!
#                                  Achievements of the whole network
# !-----------------------------------------------------------------------------------------------!
#
#   Each key under "achievements" is the ID of an achievement: a-z, 0-9 and _ only. The ID is what is
#   stored in the database (table ch_achievements), so NEVER rename it once players have progress.
#
#   name, description   shown to players in game and on the website
#   category            free text for grouping (website, menus)
#   icon                free text for whoever displays the achievement, e.g. a material name
#   hidden              true = do not show the achievement before it is unlocked
#   goal                progress needed to unlock (default 1)
#
#   source              where progress comes from:
#     type: manual          only plugins add progress: CaptainHookAPI.addAchievementProgress(...)
#     type: network-stat    follows a network-wide stat of the player. stat is one of:
#                           playtime_seconds, blocks_placed, player_kills, mob_kills, deaths
#     type: minigame-stat   follows a minigame stat reported through CaptainHookAPI: game + stat
#                           at-most: N   for stats where LOWER is better (best times kept with "min"): the
#                                        achievement unlocks once the player has the stat and it is at most N.
#                                        Use goal 1 (the default) with it. Example: BoatRace "fastest_race_<track>" in ms.
#
#   rewards             granted once (see reward-mode below):
#     kingdomcoins: 50      KingdomCoins
#     pass-xp: 100          season pass XP (skipped while no season is active)
#     commands: [...]       console commands on the player's server, {player} = name, {uuid} = UUID
#     message: "..."        shown to the player when the commands run
#     require-server: "x"   the commands only run on this server (its name in velocity.toml), e.g. a
#                           game-mode item; the reward waits in the queue while the player is elsewhere
#
#   reward-mode         when the rewards are granted:
#     claim                 the player claims them on the website (dashboard), after the unlock
#     automatic             the moment the achievement unlocks
#                         Set it at the top of the file for all achievements; an achievement can
#                         override it with its own "reward-mode" key.
#
#   The achievements are copied into the database (ch_achievement_definitions) on every start and
#   reload, which is where the website reads them from.
#
#   Lowering a goal unlocks the achievement for everyone already past it the next time their
#   progress changes. Removing an achievement keeps its rows in the database.
#
#   Apply changes with /captainhookproxy reload.
#
# !-----------------------------------------------------------------------------------------------!

